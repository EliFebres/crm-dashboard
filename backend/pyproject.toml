[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "crm-sync"
version = "2.0.0"
description = "Create CRM client interactions and upload portfolio analytics from Python, straight into the dashboard's SQLite databases."
readme = "crm_sync/docs/README.md"
requires-python = ">=3.9"

# `crm_sync` itself still imports only the standard library. The distribution does not:
# portfolio_data's documented way in and out is a DataFrame, and the notebooks need a
# server to open in. See requirements.txt for the exact pins.
dependencies = [
    "pandas>=2.0",      # portfolio_data/frames.py — the DataFrame layer
    "jupyterlab>=4.4",  # backend/notebooks/*.ipynb — nothing under backend/ imports it
]

[project.urls]
Documentation = "https://github.com/../backend/crm_sync/docs/README.md"

[tool.setuptools]
# Explicit, not auto-discovered: `backend/` is not a src-layout root, and letting setuptools
# guess here would sweep up stray top-level directories.
packages = [
    "crm_sync",
    "crm_sync.core",
    "crm_sync.db",
    "crm_sync.validation",
    "crm_sync.utils",
    "crm_sync.tests",
    "portfolio_data",
    "portfolio_data.core",
    "portfolio_data.db",
    "portfolio_data.validation",
]
